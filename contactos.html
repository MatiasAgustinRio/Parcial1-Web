<main class="Pantalla-Final">

 <h2>¿Que te parecio el proyecto?, ¿te gusto?</h2>

<form action="#" method="post" >

<div class="grupo">
<label for="nombre">Nombre Completo:</label>
<input type="text" id="nombre" name="nombre" placeholder="Nombre" pattern="[A-Z a-z]+" title="Solo letras y espacios" required>
</div>

<div class="grupo">
<label for="edad">Edad:</label>
<input type="number" id="edad" name="edad" placeholder="Edad" min="1" max="100" required>
</div>

<div class="grupo">
<label for="email">Correo electronico:</label>
<input type="email" id="email" name="email" placeholder= "Gmail" >
</div>

<div class="grupo">
<label for="telefono">Numero de telefono:</label>
<input type="tel" id="telefono" name="telefono" placeholder="+54 911 1234-5678">
</div>

<div class="grupo">
<label for="interes-usuario">¿Cual fue la catastrofes que te intereso/gusto mas?:</label>
<input type="search" id="interes-usuario" name="interes-usuario" placeholder= "???">
</div>

<div class="grupo">
<label for="opinion-critica">¿Que tal te parecio la pagina?:</label>
<textarea id="opinion-critica" name="opinion-critica" rows="4" placeholder="Ingrese su opinion o sugerencia" ></textarea>
</div>

<button class="Boton-Enviar"type="submit" >Enviar</button>

</form>
